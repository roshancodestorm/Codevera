<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI SYSTEM | Secure Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #020617; /* tailwind slate-950 */
            color: #00ffcc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.05);
        }

        /* Form Inputs */
        input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            border-color: rgba(0, 255, 204, 0.8);
        }

        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 10px; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .fade-in-card {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 0.1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            animation: scanline 4s linear infinite;
            pointer-events: none;
            z-index: 50;
        }

        /* Floating AI Particles */
        .particle {
            position: absolute;
            background: #00ffcc;
            border-radius: 50%;
            filter: blur(2px);
            animation: float 6s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(-20px) translateX(20px); }
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
    
    <!-- Background Tech Grid -->
    <div class="absolute inset-0 z-0 opacity-10" style="background-image: linear-gradient(#00ffcc 1px, transparent 1px), linear-gradient(90deg, #00ffcc 1px, transparent 1px); background-size: 30px 30px;"></div>
    
    <!-- Scanner Line -->
    <div class="scan-line"></div>

    <!-- Background glowing dots -->
    <div class="particle w-2 h-2 top-[20%] left-[20%]"></div>
    <div class="particle w-3 h-3 bottom-[30%] right-[25%]" style="animation-delay: 2s; background: #3b82f6;"></div>

    <!-- Login Container -->
    <main class="glass-panel fade-in-card z-10 w-11/12 max-w-md rounded-2xl p-8 relative overflow-hidden">
        
        <!-- Animated AI Core -->
        <div class="flex justify-center mb-6 relative">
            <div class="relative w-24 h-24 flex items-center justify-center">
                <div class="absolute w-full h-full rounded-full border-[2px] border-t-cyan-400 border-r-transparent border-b-cyan-500/30 border-l-transparent animate-[spin_3s_linear_infinite]"></div>
                <div class="absolute w-[80%] h-[80%] rounded-full border-[2px] border-t-transparent border-r-blue-400 border-b-transparent border-l-blue-500/30 animate-[spin_2s_linear_infinite_reverse]"></div>
                <div class="w-12 h-12 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-full shadow-[0_0_20px_#00ffcc] animate-pulse flex items-center justify-center">
                    <i class="fa-solid fa-fingerprint text-white text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Glowing Title -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-[0.2em] text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 drop-shadow-[0_0_10px_rgba(0,255,204,0.5)]">
                JARVIS AI SYSTEM
            </h1>
            <p class="text-xs text-slate-400 tracking-widest mt-2 uppercase">Secure Access Gateway</p>
        </div>

        <!-- Hidden Recaptcha Div required by Firebase Phone Auth -->
        <div id="recaptcha-container" class="mb-4 flex justify-center"></div>

        <!-- Form fields -->
        <form id="loginForm" class="flex flex-col gap-4">
            
            <!-- Name Input -->
            <div class="relative group">
                <i class="fa-regular fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-500/50 group-hover:text-cyan-400 transition-colors"></i>
                <input type="text" id="userName" placeholder="Authorized Name" required class="w-full bg-slate-900/50 border border-cyan-500/30 rounded-lg py-3 pl-10 pr-4 text-sm text-cyan-50 outline-none transition-all placeholder-slate-500 hover:border-cyan-500/50">
            </div>

            <!-- Email (Optional) Input -->
            <div class="relative group">
                <i class="fa-regular fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-500/50 group-hover:text-cyan-400 transition-colors"></i>
                <input type="email" id="userEmail" placeholder="Email (Optional)" class="w-full bg-slate-900/50 border border-cyan-500/30 rounded-lg py-3 pl-10 pr-4 text-sm text-cyan-50 outline-none transition-all placeholder-slate-500 hover:border-cyan-500/50">
            </div>

            <!-- Mobile Number Input Phase -->
            <div id="phoneInputPhase" class="relative group mt-2 block">
                <p class="text-[10px] tracking-widest text-cyan-400/80 mb-2 uppercase">Neural Link Sequence (OTP)</p>
                <div class="flex gap-2">
                    <select id="countryCode" class="bg-slate-900/50 border border-cyan-500/30 rounded-lg py-3 px-2 text-sm text-cyan-100 outline-none appearance-none">
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                        <option value="+91">+91</option>
                    </select>
                    <input type="tel" id="mobileNumber" placeholder="Mobile Number" class="flex-1 bg-slate-900/50 border border-cyan-500/30 rounded-lg py-3 px-4 text-sm text-cyan-50 outline-none transition-all placeholder-slate-500 focus:border-cyan-400">
                </div>
                <!-- Send OTP Button -->
                <button type="button" id="sendOtpBtn" class="w-full mt-4 py-3 rounded-lg border border-cyan-400 text-cyan-400 font-bold tracking-widest text-xs uppercase hover:bg-cyan-400/10 hover:shadow-[0_0_15px_rgba(0,255,204,0.3)] transition-all duration-300">
                    <i class="fa-solid fa-satellite-dish mr-2"></i> Transmit OTP Code
                </button>
            </div>

            <!-- OTP Verification Phase (Hidden Initially) -->
            <div id="otpVerifyPhase" class="relative group mt-2 hidden">
                <p class="text-[10px] tracking-widest text-cyan-400/80 mb-2 uppercase">Verification Matrix</p>
                <div class="relative">
                    <i class="fa-solid fa-shield-halved absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-500"></i>
                    <input type="text" id="otpCode" placeholder="Enter 6-digit Code" maxlength="6" class="w-full bg-slate-900/80 border border-cyan-400 rounded-lg py-3 pl-10 pr-4 text-sm text-cyan-50 outline-none shadow-[0_0_10px_rgba(0,255,204,0.2)]">
                </div>
                <!-- Verify OTP Button -->
                <button type="button" id="verifyOtpBtn" class="w-full mt-4 py-3 rounded-lg bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold tracking-widest text-xs uppercase hover:from-cyan-500 hover:to-blue-500 shadow-[0_0_20px_rgba(0,255,204,0.4)] transition-all duration-300 transform active:scale-95">
                    <i class="fa-solid fa-unlock-keyhole mr-2"></i> Verify & Authenticate
                </button>
            </div>

        </form>

        <div class="relative flex items-center justify-center my-6">
            <div class="border-t border-cyan-500/20 w-full"></div>
            <div class="absolute bg-[#0f172a] px-3 text-[10px] tracking-[0.2em] text-cyan-500/60 font-bold uppercase">System Override</div>
        </div>

        <!-- Google Login Option -->
        <button id="googleLoginBtn" class="w-full py-3 rounded-lg border border-slate-600 bg-slate-800/50 text-slate-200 hover:bg-slate-700 hover:border-slate-400 transition-all duration-300 flex items-center justify-center gap-3 text-xs font-semibold tracking-wide">
            <i class="fa-brands fa-google text-red-400 text-lg"></i> Access via Google
        </button>
        
        <!-- Status / Error Messages Log -->
        <div id="systemLog" class="mt-6 h-8 text-center text-[10px] text-cyan-300/60 tracking-wider font-mono uppercase bg-slate-900/50 rounded flex items-center justify-center border border-cyan-900/30 invisible">
            Awaiting Protocol...
        </div>

    </main>

    <!-- Firebase SDK Setup (Modular Version V10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ============================================
        // INSTRUCTIONS: Replace this with your actual Firebase config!
        // 1. Go to Firebase Console -> Project Settings
        // 2. Add Web App -> Copy config object below
        // 3. Enable 'Phone' and 'Google' in Authentication -> Sign-in Method
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSy_YOUR_API_KEY_HERE",
            authDomain: "your-project-id.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project-id.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567:web:abc12345"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        auth.useDeviceLanguage();

        let confirmationResult = null; // Store OTP object

        // DOM Elements
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const phonePhase = document.getElementById('phoneInputPhase');
        const otpPhase = document.getElementById('otpVerifyPhase');
        const sysLog = document.getElementById('systemLog');
        const userNameInput = document.getElementById('userName');

        function logMessage(msg, isError = false) {
            sysLog.classList.remove('invisible');
            sysLog.textContent = `> ${msg}`;
            sysLog.style.color = isError ? '#ef4444' : '#00ffcc';
            sysLog.style.borderColor = isError ? 'rgba(239, 68, 68, 0.3)' : 'rgba(0, 255, 204, 0.3)';
        }

        // Setup Recaptcha for Phone Auth
        function setupRecaptcha() {
            if(!window.recaptchaVerifier) {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                    'size': 'invisible',
                    'callback': (response) => {
                        // reCAPTCHA solved
                    }
                });
            }
        }

        // Phone Login: Send OTP
        sendOtpBtn.addEventListener('click', () => {
            const name = userNameInput.value.trim();
            const code = document.getElementById('countryCode').value;
            const number = document.getElementById('mobileNumber').value.trim();
            const fullNumber = code + number;

            if(!name) { logMessage("ERROR: Name string empty. Access Denied.", true); return; }
            if(!number || number.length < 7) { logMessage("ERROR: Invalid Number Sequence.", true); return; }

            logMessage("Initializing Neural Link. Transmitting OTP...");
            sendOtpBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Connecting...';
            sendOtpBtn.disabled = true;

            try {
                // If using real firebase uncomment below:
                /*
                setupRecaptcha();
                const appVerifier = window.recaptchaVerifier;
                signInWithPhoneNumber(auth, fullNumber, appVerifier)
                    .then((confirmResult) => {
                        window.confirmationResult = confirmResult;
                        logMessage("OTP Transmitted Successfully.");
                        transitionToOtp();
                    }).catch((error) => {
                        logMessage("ERROR: " + error.message, true);
                        resetSendBtn();
                    });
                */

                // SIMULATED Delay for Demo Purposes
                setTimeout(() => {
                    logMessage(`OTP Code transmitted to ${fullNumber}`);
                    transitionToOtp();
                }, 1500);

            } catch (err) {
                logMessage("Mainframe Offline. Firebase config missing.", true);
                resetSendBtn();
            }
        });

        function transitionToOtp() {
            phonePhase.classList.add('hidden');
            otpPhase.classList.remove('hidden');
        }

        function resetSendBtn() {
            sendOtpBtn.innerHTML = '<i class="fa-solid fa-satellite-dish mr-2"></i> Transmit OTP Code';
            sendOtpBtn.disabled = false;
        }

        // Phone Login: Verify OTP
        verifyOtpBtn.addEventListener('click', () => {
            const otpCode = document.getElementById('otpCode').value.trim();
            
            if(otpCode.length < 4) { logMessage("ERROR: Core Integrity Failed. Invalid OTP.", true); return; }

            logMessage("Verifying Matrix Signature...");
            verifyOtpBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...';

            // Real Firebase Code
            /*
            window.confirmationResult.confirm(otpCode).then((result) => {
                const user = result.user;
                logMessage(`Access Granted. Welcome ${user.phoneNumber}`);
                // Redirect logic here
            }).catch((error) => {
                logMessage("ERROR: Invalid sequence. Verification failed.", true);
                verifyOtpBtn.innerHTML = '<i class="fa-solid fa-unlock-keyhole mr-2"></i> Verify & Authenticate';
            });
            */

            // Backend Integration Function
            async function syncWithPythonBackend(userData) {
                try {
                    const response = await fetch("http://localhost:8000/api/login", {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "X-API-Key": "JARVIS-OMEGA-SECRET-999"
                        },
                        body: JSON.stringify(userData)
                    });
                    const result = await response.json();
                    if (response.ok) {
                        logMessage(`[PYTHON MATRIX DB]: ${result.status.toUpperCase()} - ${result.message}`);
                    } else {
                        throw new Error(result.detail);
                    }
                } catch (e) {
                    logMessage(`[PYTHON ERROR]: Unable to reach local SQLite database. Is the Python server running?`, true);
                }
            }

             // SIMULATED Success
             setTimeout(() => {
                logMessage(`Access Granted to JARVIS-OMEGA Mainframe.`);
                verifyOtpBtn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Authorized';
                verifyOtpBtn.classList.remove('from-cyan-600', 'to-blue-600');
                verifyOtpBtn.classList.add('from-green-600', 'to-emerald-500', 'shadow-[0_0_20px_#10b981]');
                
                // Synchronize with Python SQLite DB
                syncWithPythonBackend({
                    user_name: document.getElementById('userName').value.trim(),
                    email: document.getElementById('userEmail').value.trim() || null,
                    mobile_number: document.getElementById('countryCode').value + document.getElementById('mobileNumber').value.trim(),
                    auth_provider: "OTP"
                });
            }, 1000);
        });

        // Google Authentication Login
        googleLoginBtn.addEventListener('click', () => {
            logMessage("Routing to Google Authentication...");
            const provider = new GoogleAuthProvider();
            
            // Real Firebase Code
            /*
            signInWithPopup(auth, provider).then((result) => {
                const user = result.user;
                logMessage(`Access Granted: ${user.displayName}`);
                // Redirect to dashboard
            }).catch((error) => {
                logMessage(`G-AUTH ERROR: ${error.message}`, true);
            });
            */

            // SIMULATED Success
            setTimeout(() => {
                logMessage(`Google Authentication Override Complete.`);
                const tempName = document.getElementById('userName').value.trim() || 'Unknown Entity';
                const tempEmail = document.getElementById('userEmail').value.trim() || 'unknown@google.com';
                
                // Synchronize with Python SQLite DB
                syncWithPythonBackend({
                    user_name: tempName,
                    email: tempEmail,
                    mobile_number: null,
                    auth_provider: "Google"
                });
            }, 1000);
        });

    </script>
</body>
</html>
